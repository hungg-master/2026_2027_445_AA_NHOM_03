<body class="bg-background text-on-background min-h-screen flex items-center justify-center p-margin-mobile md:p-margin-desktop font-body-md">
<!-- Suppressed TopNavBar & Footer for Transactional Screen -->
<div class="w-full max-w-[1000px] bg-surface-container-lowest rounded-xl shadow-sm overflow-hidden flex flex-col md:flex-row">
<!-- Left Side: Image/Branding -->
<div class="hidden md:flex w-1/2 bg-surface-container-low p-12 flex-col justify-between relative overflow-hidden">
<div class="relative z-10">
<a class="font-headline-lg text-headline-lg font-bold text-primary flex items-center gap-2" href="#">
<span class="material-symbols-outlined" data-icon="school" style="font-variation-settings: 'FILL' 1;">school</span>
                    EduLink
                </a>
<h1 class="mt-8 font-headline-md text-headline-md text-on-surface">Join our learning community</h1>
<p class="mt-4 font-body-md text-body-md text-on-surface-variant max-w-sm">Connect with top educators, manage your schedule seamlessly, and accelerate your educational journey today.</p>
</div>
<div class="absolute inset-0 z-0">
<div class="w-full h-full bg-cover bg-center opacity-60" data-alt="A bright, inspiring modern library setting with soft natural light streaming through large windows. The scene features abstract educational elements like floating geometric shapes and books, maintaining a clean, minimalist aesthetic with subtle tones of primary blue and crisp white to match the EduLink brand. The overall mood is encouraging, professional, and forward-thinking." style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuA5gtoPCVPPzIMIVIyTL-MhBDDIO1vgIqtuep1PypX-eFQW5BKvihfXKz3Tf0AQBcmURY87MbPxZga5_KDUf0VHgEwhqPrt96tOl5mZ8wBiwcOgTx_7AQi9QCrji4fV045ekt2dKFVvxe9jqimOLFDnWnFbmOAf_CANTiLMIvgJAIbodlU8ylfy6qYdzRnt8W3NGJ5KUgYQKSEHtjQGOFP-LZ84KYE1RXUQXGz50adN-PaqiW1VHXHK4Q')"></div>
<div class="absolute inset-0 bg-gradient-to-t from-surface-container-low to-transparent"></div>
</div>
</div>
<!-- Right Side: Form -->
<div class="w-full md:w-1/2 p-8 md:p-12">
<div class="md:hidden mb-8">
<a class="font-headline-md text-headline-md font-bold text-primary flex items-center gap-2 justify-center" href="#">
<span class="material-symbols-outlined" data-icon="school" style="font-variation-settings: 'FILL' 1;">school</span>
                    EduLink
                </a>
</div>
<div class="mb-8 text-center md:text-left">
<h2 class="font-headline-sm text-headline-sm text-on-surface">Create an Account</h2>
<p class="font-body-sm text-body-sm text-on-surface-variant mt-2">Sign up to get started as a student.</p>
</div>
<form class="space-y-4">
<div class="grid grid-cols-1 md:grid-cols-2 gap-4">
<div>
<label class="block font-label-sm text-label-sm text-on-surface mb-1" for="fullName">Full Name</label>
<input class="w-full h-12 px-4 bg-surface-container-lowest border border-outline-variant rounded focus:border-primary focus:ring-1 focus:ring-primary transition-colors font-body-md text-body-md" id="fullName" name="fullName" placeholder="John Doe" type="text"/>
</div>
<div>
<label class="block font-label-sm text-label-sm text-on-surface mb-1" for="username">Username</label>
<input class="w-full h-12 px-4 bg-surface-container-lowest border border-outline-variant rounded focus:border-primary focus:ring-1 focus:ring-primary transition-colors font-body-md text-body-md" id="username" name="username" placeholder="johndoe123" type="text"/>
</div>
</div>
<div>
<label class="block font-label-sm text-label-sm text-on-surface mb-1" for="email">Email</label>
<input class="w-full h-12 px-4 bg-surface-container-lowest border border-outline-variant rounded focus:border-primary focus:ring-1 focus:ring-primary transition-colors font-body-md text-body-md" id="email" name="email" placeholder="john@example.com" type="email"/>
</div>
<div>
<label class="block font-label-sm text-label-sm text-on-surface mb-1" for="password">Password</label>
<input class="w-full h-12 px-4 bg-surface-container-lowest border border-outline-variant rounded focus:border-primary focus:ring-1 focus:ring-primary transition-colors font-body-md text-body-md" id="password" name="password" placeholder="••••••••" type="password"/>
</div>
<div>
<label class="block font-label-sm text-label-sm text-on-surface mb-1" for="confirmPassword">Confirm Password</label>
<input class="w-full h-12 px-4 bg-surface-container-lowest border border-outline-variant rounded focus:border-primary focus:ring-1 focus:ring-primary transition-colors font-body-md text-body-md" id="confirmPassword" name="confirmPassword" placeholder="••••••••" type="password"/>
</div>
<div class="flex items-start gap-2 pt-2">
<div class="flex items-center h-5">
<input class="w-4 h-4 border border-outline-variant rounded bg-surface-container-lowest text-primary focus:ring-primary" id="terms" type="checkbox"/>
</div>
<label class="font-body-sm text-body-sm text-on-surface-variant" for="terms">
                        I agree to the <a class="text-primary hover:underline" href="#">Terms and Conditions</a> and <a class="text-primary hover:underline" href="#">Privacy Policy</a>.
                    </label>
</div>
<div class="pt-4">
<button class="w-full h-12 bg-primary text-on-primary font-label-md text-label-md rounded hover:bg-primary-container transition-colors shadow-sm" type="button">
                        Create Account
                    </button>
</div>
<div class="relative py-4">
<div class="absolute inset-0 flex items-center">
<div class="w-full border-t border-outline-variant"></div>
</div>
<div class="relative flex justify-center">
<span class="px-4 bg-surface-container-lowest font-label-sm text-label-sm text-on-surface-variant">Or sign up with</span>
</div>
</div>
<div class="grid grid-cols-2 gap-4">
<button class="flex items-center justify-center gap-2 h-12 bg-surface-container-lowest border border-outline-variant rounded-full font-label-sm text-label-sm text-on-surface hover:bg-surface-container-low transition-colors" type="button">
<svg class="w-5 h-5" fill="currentColor" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"></path>
<path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path>
<path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"></path>
<path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"></path>
</svg>
                        Google

<svg class="w-5 h-5" fill="currentColor" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M22 12c0-5.52-4.48-10-10-10S2 6.48 2 12c0 4.84 3.44 8.87 8 9.8V15H8v-3h2V9.5C10 7.57 11.57 6 13.5 6H16v3h-2c-.55 0-1 .45-1 1v2h3v3h-3v6.95c5.05-1.11 9-5.53 9-10.95z" fill="#1877F2"></path>
</svg>

                    </button>
</div>
<div class="pt-6 text-center font-body-sm text-body-sm text-on-surface-variant">
                    Already have an account? <a class="text-primary font-medium hover:underline" href="#">Log In</a>
</div>
